<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="index.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="//unpkg.com/alpinejs" defer></script>
    <style>
        body {
            background-color: #000;
        }
        
    </style>
</head>

<body>

    <div x-data="calculator" class="container py-4 mx-auto w-1/4">

        <div class="pb-4">
            <div class="mb-6">
                <label for="default-input" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Output</label>
                <input type="text" id="default-input" readonly x-model="output"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
            </div>
            <div class="mb-6">
                <label for="default-input" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">input</label>
                <input type="number" id="default-input" x-model="input" readonly
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
            </div>
        </div>
        <div class="relative overflow-x-auto">
            <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">

                <tbody>
                    <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200">
                        <th class="px-1 py-1">
                            <button x-on:click="getInput(1)"
                                class="bg-blue-600 text-white font-bold py-2 px-4 rounded">
                                1</button>
                        </th>
                        <td class="px-1 py-1">
                            <button x-on:click="getInput(2)"
                                class="bg-blue-600 text-white font-bold py-2 px-4 rounded">2</button>
                        </td>
                        <td class="px-1 py-1">
                            <button x-on:click="getInput(3)"
                                class="bg-blue-600 text-white font-bold py-2 px-4 rounded">3</button>
                        </td>
                        <td class="px-1 py-1">
                            <button x-on:click="operand('/')"
                                class="bg-blue-600 text-white font-bold py-2 px-4 rounded">
                                /</button>
                        </td>
                    </tr>
                    <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200">
                        <th class="px-1 py-1">
                            <button x-on:click="getInput(4)"
                                class="bg-blue-600 text-white font-bold py-2 px-4 rounded">4</button>
                        </th>
                        <td class="px-1 py-1">
                            <button x-on:click="getInput(5)"
                                class="bg-blue-600 text-white font-bold py-2 px-4 rounded">5</button>
                        </td>
                        <td class="px-1 py-1">
                            <button x-on:click="getInput(6)"
                                class="bg-blue-600 text-white font-bold py-2 px-4 rounded">6</button>
                        </td>
                        <td class="px-1 py-1">
                            <button x-on:click="operand('*')"
                                class="bg-blue-600 text-white font-bold py-2 px-4 rounded">
                                x</button>
                        </td>
                    </tr>
                    <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200">
                        <th class="px-1 py-1">
                            <button x-on:click="getInput(7)"
                                class="bg-blue-600 text-white font-bold py-2 px-4 rounded">7</button>
                        </th>
                        <td class="px-1 py-1">
                            <button x-on:click="getInput(8)"
                                class="bg-blue-600 text-white font-bold py-2 px-4 rounded">8</button>
                        </td>
                        <td class="px-1 py-1">
                            <button x-on:click="getInput(9)"
                                class="bg-blue-600 text-white font-bold py-2 px-4 rounded">9</button>
                        </td>
                        <td class="px-1 py-1">
                            <button x-on:click="operand('+')"
                                class="bg-blue-600 text-white font-bold py-2 px-4 rounded">+</button>
                        </td>
                    </tr>
                    <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200">
                        <td class="px-1 py-1">
                            <button x-on:click="getInput(0)"
                                class="bg-blue-600 text-white font-bold py-2 px-4 rounded">0</button>
                        </td>
                        <td class="px-1 py-1">
                            <button x-on:click="resetAll()"
                                class="bg-blue-600 text-white font-bold py-2 px-4 rounded">C</button>
                        </td>
                        <th class="px-1 py-1">
                            <button x-on:click="operand('-')"
                                class="bg-blue-600 text-white font-bold py-2 px-4 rounded">-</button>
                        </th>
                        <td class="px-1 py-1">
                            <button x-on:click="operand('%')"
                                class="bg-blue-600 text-white font-bold py-2 px-4 rounded">%</button>
                        </td>

                    </tr>
                </tbody>
            </table>
        </div>
    </div>


</body>

</html>
